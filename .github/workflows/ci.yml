name: CI

on:
  push:
    branches: [ main, 'arena/*' ]
  pull_request:

permissions:
  contents: write
  issues: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zig (pinned)
        run: |
          set -o pipefail
          {
            set -x
            python --version
            python -m venv venv
            ./venv/bin/pip --version
            ./venv/bin/pip install --quiet ziglang==0.15.2
            export PATH="$PWD/venv/bin:$PATH"
            zig version
          } 2>&1 | tee /tmp/ci.log

      # 1) кросс-сборка arm64
      - name: Build libmenu-br.so (aarch64)
        run: |
          set -o pipefail
          { set -x; ./build.sh zig; } 2>&1 | tee -a /tmp/ci.log

      # 2) аудит ABI: NEEDED = 0, экспорт ровно 4 символа
      - name: Audit dynamic ABI
        run: |
          set -o pipefail
          {
            set -x
            SO=build/libmenu-br.so
            echo "--- NEEDED (должно быть пусто) ---"
            need=$(readelf -d "$SO" | grep -c NEEDED || true)
            [ "$need" = "0" ] || { echo "ERROR: найдены NEEDED-зависимости"; exit 1; }
            echo "OK: NEEDED = 0"
            echo "--- экспорт ---"
            exp=$(readelf --dyn-syms -W "$SO" | awk '$5=="GLOBAL" && $7 ~ /^[0-9]+$/ {print $8}' | sort -u)
            echo "$exp"
            [ "$exp" = "$(printf 'JNI_OnLoad\nMenuBR_Init\nMenuBR_IsActive\nMenuBR_Shutdown')" ] \
              || { echo "ERROR: unexpected exports"; exit 1; }
            echo "OK: экспорт корректен"
          } 2>&1 | tee -a /tmp/ci.log

      # 3) хост-тест: ELF/PLT/сигнатуры на reference/libblackrussia-client.so
      - name: Host test (x86_64)
        run: |
          set -o pipefail
          { set -x; make test; } 2>&1 | tee -a /tmp/ci.log
          touch /tmp/ci_ok

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libmenu-br-arm64
          path: build/libmenu-br.so

      # 4) диагностика:
      #    успех  -> лог в ветку ci-diagnostics
      #    сбой   -> лог в issue "CI failure run <id>"
      - name: Publish CI log
        if: always()
        run: |
          {
            echo "# CI log — run ${GITHUB_RUN_ID} — $(date -u +%FT%TZ)"
            echo ""
            cat /tmp/ci.log 2>/dev/null || echo "(no log captured)"
          } > /tmp/ci-log.txt

          if [ -f /tmp/ci_ok ]; then
            # зелёный: публикуем лог в ветку
            cd /tmp
            rm -rf ciup && git init -q ciup && cd ciup
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            cp /tmp/ci-log.txt ci-log.txt
            git add ci-log.txt
            git -c user.email="ci@arena.bot" -c user.name="ci-log" \
              commit -q -m "ci log run ${GITHUB_RUN_ID}"
            git push -qf origin HEAD:ci-diagnostics || echo "push ci-diagnostics: нет прав (некритично)"
            echo "CI green"
          else
            # красный: issue с полным логом (лимит тела issue — 64KB)
            echo "CI failed — публикуем issue"
            head -c 60000 /tmp/ci-log.txt > /tmp/ci-issue.txt
            gh issue create \
              --title "CI failure run ${GITHUB_RUN_ID}" \
              --body-file /tmp/ci-issue.txt \
              || { echo "gh issue create failed"; tail -c 8000 /tmp/ci-log.txt; }
          fi
